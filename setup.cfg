[metadata]
name = germidiff
version = 1.0
description = Diff the expanded seed package lists between two refs
url = https://git.launchpad.net/germidiff
license = GNU GPL

[options]
packages = find:
python_requires = >=3.6
scripts =
    bin/germidiff

[options.packages.find]
exclude =
    tests

[flake8]
max-line-length = 79
ignore =
    # Incompatible with Black.
    E203,
    W503

# Example germinate-diff collection map.
#
# Copy to ~/.config/germinate-diff/collections.conf and edit.
#
# Each key is a seed collection branch name exactly as it appears in an
# "include" line of a STRUCTURE file (and as germinate's --seed-dist), and
# each value is a local checkout of that collection.  These checkouts are used
# as-is for both germinate runs, so that only the collection under test varies
# between them.
#
# Relative paths are resolved against the directory holding this file.

[collections]
platform.questing = ~/seeds/platform
ubuntu.questing = ~/seeds/ubuntu
